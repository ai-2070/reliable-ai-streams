name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runtimes covered by the vitest 5 engine range (^22.12.0 || ^24 || >=26);
        # node 25 is excluded there, so it is not part of the support matrix.
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Guard the whole `ai` v6 half of the peer range (^6.0.0 || ^7.0.0).
  # The main job above exercises ai v7 (the saved devDependency). Both ends of
  # v6 are needed: `6.0.0` catches use of an API added mid-major, `6` catches
  # anything the newest 6.x changed or removed.
  compat-ai-v6:
    name: Build against ai@${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["6.0.0", "6"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Pin ai
        run: npm install ai@${{ matrix.version }} --no-save

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Same for the `openai` v6 half of the range. The gap here is wide: the floor
  # is 6.0.0 and the newest 6.x is 6.49.0.
  compat-openai-v6:
    name: Build against openai@${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["6.0.0", "6"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Pin openai
        run: npm install openai@${{ matrix.version }} --no-save

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
